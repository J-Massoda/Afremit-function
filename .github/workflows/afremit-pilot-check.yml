name: Afremit pilot checks
on:
  pull_request:
  push:
    branches:
      - afremit-education-pilot-v2
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: afremit-pilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
